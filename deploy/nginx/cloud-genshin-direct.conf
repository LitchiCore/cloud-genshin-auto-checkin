# 此站点默认不要启用；第一次运行 cloud-genshin-ipv6-update 后，
# helper 会写入真实证书路径并创建 sites-enabled 软链接。
server {
    listen [::]:8000 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PLACEHOLDER/privkey.pem;

    location = /admin/ipv6/update {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
